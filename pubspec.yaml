name: ligtaslink
description: "LigtasLink - Connecting Help, Saving Lives."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

  # Existing packages
  crypto: ^3.0.3
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.2.3
  http: ^1.2.2
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  html: ^0.15.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_ligtaslink.jpg
    - assets/services.json